<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Savings Tracker</title>
    <style>
        :root {
            --bg-color: #f9fafb;
            --text-main: #111827;
            --text-muted: #6b7280;
            --primary: #10b981;
            /* Soft Green */
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
            --input-bg: #f3f4f6;
        }

        /* Dark mode variables */
        body.dark-mode {
            --bg-color: #111827;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --primary: #10b981;
            --card-bg: #1f2937;
            --border-color: #374151;
            --input-bg: #374151;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 400px;
            /* Mobile width */
            background: var(--card-bg);
            padding: 25px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            transition: background-color 0.3s;
            position: relative;
        }

        h1 {
            font-size: 24px;
            margin: 0;
            font-weight: 600;
            text-align: center;
        }

        .subtitle {
            margin: 4px 0 20px 0;
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
        }

        /* Progress Bar Styles */
        .progress-section {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
        }

        .progress-section:last-of-type {
            border-bottom: none;
            margin-bottom: 15px;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .progress-title {
            font-weight: 600;
        }

        .progress-value {
            color: var(--text-muted);
        }

        .progress-bar-bg {
            background-color: var(--border-color);
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            /* For milestones */
        }

        .progress-bar-fill {
            background-color: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 10px;
        }

        .milestone-dots {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-around;
        }

        .dot {
            height: 100%;
            width: 3px;
            background-color: rgba(255, 255, 255, 0.7);
        }

        /* Surplus Area */
        .surplus-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-color);
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }

        .surplus-label {
            font-weight: 600;
            font-size: 14px;
        }

        .surplus-input-wrapper {
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border-radius: 8px;
            padding: 5px 10px;
        }

        .currency-symbol {
            color: var(--text-muted);
            margin-right: 5px;
            font-weight: 500;
        }

        .surplus-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 16px;
            width: 100px;
            text-align: right;
            outline: none;
            font-family: inherit;
        }

        /* Month List Styles */
        .month-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .month-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background: var(--bg-color);
            border-radius: 16px;
            transition: background-color 0.3s;
        }

        .left-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .month-name {
            font-weight: 500;
            font-size: 16px;
        }

        .amount {
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Custom Checkbox */
        input[type="checkbox"] {
            appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            /* Circular */
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            background-color: transparent;
        }

        input[type="checkbox"]:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            color: white;
            font-size: 16px;
            left: 4px;
            top: 0px;
        }

        /* Toggle Button */
        button.theme-toggle {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-main);
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button.theme-toggle:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Savings Goals</h1>
        <p class="subtitle">Your progress towards financial freedom</p>

        <!-- Overall Goal: 45 Lakhs -->
        <div class="progress-section">
            <div class="progress-labels">
                <span class="progress-title">Overall Goal</span>
                <span class="progress-value" id="overall-goal-text">₹0 / ₹45,00,000</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="overall-progress-fill"></div>
                <!-- Milestone Dots at 12, 24, 36 Lakhs -->
                <div class="milestone-dots">
                    <div class="dot" style="margin-left: 26.66%;"></div> <!-- 12/45 -->
                    <div class="dot" style="margin-right: 26.66%;"></div> <!-- 24/45 -> 12 from end -->
                </div>
            </div>
        </div>

        <!-- Yearly Goal: 12 Lakhs -->
        <div class="progress-section">
            <div class="progress-labels">
                <span class="progress-title">Yearly Progress (2026)</span>
                <span class="progress-value" id="yearly-goal-text">₹0 / ₹12,00,000</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="yearly-progress-fill"></div>
            </div>
        </div>

        <!-- Surplus Amount Box -->
        <div class="surplus-container">
            <span class="surplus-label">Surplus Amount</span>
            <div class="surplus-input-wrapper">
                <span class="currency-symbol">₹</span>
                <input type="text" id="surplus-input" class="surplus-input" placeholder="0"
                    oninput="handleSurplusInput(this)">
            </div>
        </div>

        <div class="month-list" id="months-container">
            <!-- JavaScript will populate the months here -->
        </div>

        <button class="theme-toggle" onclick="toggleTheme()">☀️ Toggle Dark Mode</button>
    </div>

    <script>
        const months = ["Jan 2026", "Feb 2026", "Mar 2026", "Apr 2026", "May 2026", "Jun 2026", "Jul 2026", "Aug 2026", "Sep 2026", "Oct 2026", "Nov 2026", "Dec 2026"];
        const container = document.getElementById('months-container');
        const yearlyProgressFill = document.getElementById('yearly-progress-fill');
        const overallProgressFill = document.getElementById('overall-progress-fill');
        const yearlyGoalText = document.getElementById('yearly-goal-text');
        const overallGoalText = document.getElementById('overall-goal-text');
        const surplusInput = document.getElementById('surplus-input');

        const SAVING_PER_MONTH = 100000;
        const YEARLY_GOAL = 1200000;
        const OVERALL_GOAL = 4500000;

        // Load progress from localStorage
        let savedProgress = JSON.parse(localStorage.getItem("minimal_savings_progress") || "{}");
        let savedSurplus = localStorage.getItem("minimal_surplus_amount") || "0";

        // Initialize surplus input
        surplusInput.value = parseInt(savedSurplus).toLocaleString('en-IN') || "";

        // Theme management
        let isDarkMode = localStorage.getItem("savings_tracker_theme") === "dark";
        const toggleBtn = document.querySelector('.theme-toggle');

        function applyTheme() {
            if (isDarkMode) {
                document.body.classList.add('dark-mode');
                toggleBtn.textContent = "🌙 Toggle Light Mode";
            } else {
                document.body.classList.remove('dark-mode');
                toggleBtn.textContent = "☀️ Toggle Dark Mode";
            }
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            localStorage.setItem("savings_tracker_theme", isDarkMode ? "dark" : "light");
            applyTheme();
        }

        // Initial theme application
        applyTheme();

        // Function to format numbers as Indian Rupees
        const formatToLakhs = (num) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(num);

        months.forEach(month => {
            const item = document.createElement('div');
            item.className = 'month-item';

            const isChecked = savedProgress[month] ? "checked" : "";

            item.innerHTML = `
                <div class="left-section">
                    <input type="checkbox" class="month-checkbox" data-month="${month}" onchange="calculateProgress(this)" ${isChecked}>
                    <span class="month-name">${month}</span>
                </div>
                <span class="amount">${formatToLakhs(SAVING_PER_MONTH)}</span>
            `;
            container.appendChild(item);
        });

        function handleSurplusInput(inputElement) {
            // Remove non-digit characters to get raw number
            let rawValue = inputElement.value.replace(/\D/g, '');
            if (!rawValue) rawValue = "0";

            // Save raw value to localStorage
            localStorage.setItem("minimal_surplus_amount", rawValue);
            savedSurplus = rawValue;

            // Format back to Indian Rupee convention visually in the input box
            const numberValue = parseInt(rawValue);
            inputElement.value = numberValue === 0 ? "" : numberValue.toLocaleString('en-IN');

            // Recalculate everything
            calculateProgress();
        }

        function calculateProgress(checkboxElement) {
            // Update localStorage if triggered by a checkbox change
            if (checkboxElement) {
                savedProgress[checkboxElement.dataset.month] = checkboxElement.checked;
                localStorage.setItem("minimal_savings_progress", JSON.stringify(savedProgress));
            }

            const checkedCount = document.querySelectorAll('.month-checkbox:checked').length;
            const progressFromMonths = checkedCount * SAVING_PER_MONTH;
            const surplusAmount = parseInt(savedSurplus) || 0;

            // Total includes months progress + surplus
            const totalDisplayAmount = progressFromMonths + surplusAmount;

            // Progress bar filling ONLY depends on the checked months (progressFromMonths)
            const yearlyPercentage = Math.min((progressFromMonths / YEARLY_GOAL) * 100, 100);
            yearlyProgressFill.style.width = \`\${yearlyPercentage}%\`;
            
            // Text display depends on the total combined amount
            yearlyGoalText.textContent = \`\${formatToLakhs(totalDisplayAmount)} / \${formatToLakhs(YEARLY_GOAL)}\`;

            // Same logic for overall goal
            const overallPercentage = Math.min((progressFromMonths / OVERALL_GOAL) * 100, 100);
            overallProgressFill.style.width = \`\${overallPercentage}%\`;
            overallGoalText.textContent = \`\${formatToLakhs(totalDisplayAmount)} / \${formatToLakhs(OVERALL_GOAL)}\`;
        }

        // Initial calculation on load
        calculateProgress();
    </script>
</body>

</html>
