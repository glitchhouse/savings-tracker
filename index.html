<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Savings Tracker</title>
    <style>
        :root {
            --bg-color: #f9fafb;
            --text-main: #111827;
            --text-muted: #6b7280;
            --primary: #10b981;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
            --input-bg: #f3f4f6;
        }

        body.dark-mode {
            --bg-color: #111827;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --primary: #10b981;
            --card-bg: #1f2937;
            --border-color: #374151;
            --input-bg: #374151;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 25px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            transition: background-color 0.3s;
        }

        h1 {
            font-size: 24px;
            margin: 0;
            font-weight: 600;
            text-align: center;
        }

        .subtitle {
            margin: 4px 0 20px 0;
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
        }

        .progress-section {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .progress-title {
            font-weight: 600;
        }

        .progress-value {
            color: var(--text-muted);
        }

        .progress-bar-bg {
            background-color: var(--border-color);
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            background-color: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 10px;
        }

        .milestone-dots {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
        }

        .dot {
            height: 100%;
            width: 3px;
            background-color: rgba(255, 255, 255, 0.7);
        }

        /* Surplus */
        .surplus-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-color);
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }

        .surplus-label {
            font-weight: 600;
            font-size: 14px;
        }

        .surplus-input-wrapper {
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border-radius: 8px;
            padding: 5px 10px;
        }

        .currency-symbol {
            color: var(--text-muted);
            margin-right: 5px;
            font-weight: 500;
        }

        .surplus-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 16px;
            width: 100px;
            text-align: right;
            outline: none;
            font-family: inherit;
        }

        .surplus-check {
            color: var(--primary);
            margin-left: 8px;
            opacity: 0;
            transition: opacity 0.3s;
            font-weight: bold;
        }

        .surplus-check.show {
            opacity: 1;
        }

        /* Month list */
        .month-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .month-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background: var(--bg-color);
            border-radius: 16px;
            transition: background-color 0.3s;
        }

        .left-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .month-name {
            font-weight: 500;
            font-size: 16px;
        }

        .amount {
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Custom Checkbox */
        input[type="checkbox"] {
            appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            background-color: transparent;
            flex-shrink: 0;
        }

        input[type="checkbox"]:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            color: white;
            font-size: 14px;
            left: 4px;
            top: 1px;
        }

        /* Dark mode toggle */
        button.theme-toggle {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-main);
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button.theme-toggle:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Savings Goals</h1>
        <p class="subtitle">Your progress towards financial freedom</p>

        <!-- Overall Goal: 45 Lakhs -->
        <div class="progress-section">
            <div class="progress-labels">
                <span class="progress-title">Overall Goal</span>
                <span class="progress-value" id="overall-goal-text">Rs.0 / Rs.45,00,000</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="overall-progress-fill"></div>
                <div class="milestone-dots">
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
        </div>

        <!-- Yearly Goal: 12 Lakhs -->
        <div class="progress-section">
            <div class="progress-labels">
                <span class="progress-title">Yearly Progress (2026)</span>
                <span class="progress-value" id="yearly-goal-text">Rs.0 / Rs.12,00,000</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="yearly-progress-fill"></div>
            </div>
        </div>

        <!-- Surplus Amount Box -->
        <div class="surplus-container">
            <span class="surplus-label">Surplus Amount</span>
            <div class="surplus-input-wrapper">
                <span class="currency-symbol">&#8377;</span>
                <input type="text" id="surplus-input" class="surplus-input" placeholder="0"
                    oninput="handleSurplusInput(this)">
                <span id="surplus-check" class="surplus-check">&#10003;</span>
            </div>
        </div>

        <!-- Month List -->
        <div class="month-list" id="months-container"></div>

        <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">Toggle Dark Mode</button>
    </div>

    <script>
        var MONTHS = ["Jan 2026", "Feb 2026", "Mar 2026", "Apr 2026", "May 2026", "Jun 2026", "Jul 2026", "Aug 2026", "Sep 2026", "Oct 2026", "Nov 2026", "Dec 2026"];
        var SAVING_PER_MONTH = 100000;
        var YEARLY_GOAL = 1200000;
        var OVERALL_GOAL = 4500000;

        var savedProgress = JSON.parse(localStorage.getItem("savings_progress") || "{}");
        var savedSurplus = parseInt(localStorage.getItem("savings_surplus") || "0");
        var isDarkMode = localStorage.getItem("savings_theme") === "dark";

        var yearlyFill = document.getElementById("yearly-progress-fill");
        var overallFill = document.getElementById("overall-progress-fill");
        var yearlyText = document.getElementById("yearly-goal-text");
        var overallText = document.getElementById("overall-goal-text");
        var surplusInputEl = document.getElementById("surplus-input");
        var surplusCheckEl = document.getElementById("surplus-check");
        var themeBtn = document.getElementById("theme-btn");
        var monthsContainer = document.getElementById("months-container");

        function fmt(num) {
            return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(num);
        }

        // Apply theme
        function applyTheme() {
            if (isDarkMode) {
                document.body.classList.add('dark-mode');
                themeBtn.textContent = "Toggle Light Mode";
            } else {
                document.body.classList.remove('dark-mode');
                themeBtn.textContent = "Toggle Dark Mode";
            }
        }
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            localStorage.setItem("savings_theme", isDarkMode ? "dark" : "light");
            applyTheme();
        }
        applyTheme();

        // Build month list
        MONTHS.forEach(function (month) {
            var item = document.createElement('div');
            item.className = 'month-item';

            var left = document.createElement('div');
            left.className = 'left-section';

            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.className = 'month-checkbox';
            cb.setAttribute('data-month', month);
            cb.checked = !!savedProgress[month];
            cb.onchange = function () { onCheckboxChange(this); };

            var name = document.createElement('span');
            name.className = 'month-name';
            name.textContent = month;

            left.appendChild(cb);
            left.appendChild(name);

            var amt = document.createElement('span');
            amt.className = 'amount';
            amt.textContent = fmt(SAVING_PER_MONTH);

            item.appendChild(left);
            item.appendChild(amt);
            monthsContainer.appendChild(item);
        });

        // Set surplus input display
        if (savedSurplus > 0) {
            surplusInputEl.value = savedSurplus.toLocaleString('en-IN');
        }

        var checkTimer;
        function handleSurplusInput(el) {
            var raw = el.value.replace(/\D/g, '');
            savedSurplus = raw ? parseInt(raw) : 0;
            localStorage.setItem("savings_surplus", savedSurplus);

            // Format in Indian convention
            el.value = savedSurplus > 0 ? savedSurplus.toLocaleString('en-IN') : '';

            // Show temporary checkmark
            surplusCheckEl.classList.add('show');
            clearTimeout(checkTimer);
            checkTimer = setTimeout(function () {
                surplusCheckEl.classList.remove('show');
            }, 1200);

            updateProgress();
        }

        function onCheckboxChange(cb) {
            savedProgress[cb.getAttribute('data-month')] = cb.checked;
            localStorage.setItem("savings_progress", JSON.stringify(savedProgress));
            updateProgress();
        }

        function updateProgress() {
            var checked = document.querySelectorAll('.month-checkbox:checked').length;
            var fromMonths = checked * SAVING_PER_MONTH;
            var total = fromMonths + savedSurplus;

            // Progress bars only reflect checkbox months
            var yp = Math.min((fromMonths / YEARLY_GOAL) * 100, 100);
            var op = Math.min((fromMonths / OVERALL_GOAL) * 100, 100);
            yearlyFill.style.width = yp + '%';
            overallFill.style.width = op + '%';

            // Labels show total (months + surplus)
            yearlyText.textContent = fmt(total) + ' / ' + fmt(YEARLY_GOAL);
            overallText.textContent = fmt(total) + ' / ' + fmt(OVERALL_GOAL);
        }

        updateProgress();
    </script>
</body>

</html>
