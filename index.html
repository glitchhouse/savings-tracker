<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings Tracker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f0f2f5;
        }
        
        #lockscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .lock-box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        #pinInput {
            font-size: 20px;
            padding: 10px;
            width: 120px;
            text-align: center;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        
        button {
            background: #007aff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        
        button:hover {
            background: #0056b3;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        .month {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }
        
        .month:last-child {
            border-bottom: none;
        }
        
        .month label {
            flex-grow: 1;
            font-size: 18px;
            cursor: pointer;
        }
        
        input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="lockscreen">
        <div class="lock-box">
            <h2>Enter PIN</h2>
            <input type="password" id="pinInput" maxlength="4" placeholder="••••">
            <br>
            <button onclick="unlock()">Unlock</button>
        </div>
    </div>

    <div class="container" id="app" style="display: none;">
        <h1>Monthly Savings Tracker</h1>
        <p>Your progress is saved automatically on this device.</p>
        
        <div id="months-container">
        </div>
    </div>

    <script>
        const DEFAULT_PIN = "1234";

        if(!localStorage.getItem("tracker_pin")){
            localStorage.setItem("tracker_pin", DEFAULT_PIN);
        }

        function unlock() {
            const entered = document.getElementById("pinInput").value;
            const saved = localStorage.getItem("tracker_pin");

            if(entered === saved){
                document.getElementById("lockscreen").style.display = "none";
                document.getElementById("app").style.display = "block";
                loadProgress();
            } else {
                alert("Wrong PIN");
            }
        }
        
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        
        function loadProgress() {
            const container = document.getElementById("months-container");
            container.innerHTML = "";
            
            let savedProgress = JSON.parse(localStorage.getItem("tracker_progress") || "{}");
            
            months.forEach(month => {
                const div = document.createElement("div");
                div.className = "month";
                
                const label = document.createElement("label");
                label.htmlFor = month;
                label.textContent = month;
                
                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.id = month;
                checkbox.checked = savedProgress[month] || false;
                
                checkbox.addEventListener("change", (e) => {
                    savedProgress[month] = e.target.checked;
                    localStorage.setItem("tracker_progress", JSON.stringify(savedProgress));
                });
                
                div.appendChild(label);
                div.appendChild(checkbox);
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
